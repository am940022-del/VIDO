<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>رصد الحضور</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <span class="brand"><span class="brand-mark" aria-hidden="true">✓</span><span id="school-name">رصد الحضور</span></span>
      <span class="grow"></span>
      <span class="muted small" id="today"></span>
    </div>
  </header>

  <div class="teacher-bar hidden" id="teacher-bar">
    <div class="container">
      <div class="picker" id="picker">
        <button type="button" class="picker-btn" id="picker-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="picker-label">المعلم</span>
          <span class="picker-value" id="picker-value">اختر اسمك</span>
          <span class="picker-caret" aria-hidden="true">▾</span>
        </button>
        <div class="picker-panel hidden" id="picker-panel">
          <div class="search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="picker-search" type="search" placeholder="ابحث عن اسمك" autocomplete="off" aria-label="ابحث عن اسم المعلم" aria-controls="picker-list">
          </div>
          <ul class="picker-list" id="picker-list" role="listbox" aria-label="المعلمون"></ul>
        </div>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="error" class="alert alert-error hidden" role="alert" style="margin-top:24px"></div>

    <!-- 1) اختيار الصف -->
    <section id="view-grades" class="hidden">
      <div class="teacher-head stack">
        <button type="button" id="resume" class="resume hidden"></button>
      </div>
      <p class="step-title">اختر الصف</p>
      <div class="tiles" id="grade-tiles"></div>
      <p id="no-grades" class="empty hidden">لم ترفع الإدارة قوائم الطلاب بعد.</p>
    </section>

    <!-- 2) اختيار الشعبة والحصة -->
    <section id="view-pick" class="hidden">
      <div class="teacher-head row">
        <button class="btn btn-ghost" id="back-grades" type="button">→ الصفوف</button>
        <h1 id="pick-grade" class="grow"></h1>
      </div>
      <p class="alert alert-ok" id="pick-hint" style="margin-bottom:24px"></p>
      <div class="stack-lg">
        <div>
          <p class="step-title">الشعبة</p>
          <div class="chips" id="section-chips"></div>
        </div>
        <div>
          <p class="step-title">الحصة</p>
          <div class="chips" id="period-chips"></div>
        </div>
      </div>
    </section>

    <!-- 3) قائمة الطلاب -->
    <section id="view-list" class="hidden">
      <div class="teacher-head row between">
        <div class="crumbs" id="crumbs"></div>
        <button class="btn btn-sm" id="change-pick" type="button">تغيير</button>
      </div>
      <p class="muted small">الجميع حاضرون افتراضياً — اضغط فقط على حالة الغائب أو المتأخر أو الهارب. ضغطة أخرى تلغيها، والضغط على الاسم يضيف ملاحظة.</p>
      <div class="sticky-tools">
        <div class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="ابحث باسم الطالب" autocomplete="off" aria-label="ابحث باسم الطالب">
        </div>
        <div class="row between" style="margin-top:12px">
          <div class="summary-bar" id="summary" style="margin:0"></div>
          <span class="save-state small" id="save-state" role="status" aria-live="polite"></span>
        </div>
      </div>
      <div class="students" id="students"></div>
    </section>
  </main>

  <div id="sheet" class="sheet-backdrop hidden">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
      <p class="muted small">حدد الحالة مع ملاحظة</p>
      <h3 id="sheet-name"></h3>
      <div class="choice-grid">
        <button class="choice absent" data-type="absent" type="button">غياب<small>لم يحضر</small></button>
        <button class="choice late" data-type="late" type="button">تأخير<small>حضر متأخراً</small></button>
        <button class="choice escape" data-type="escape" type="button">هروب<small>خرج دون إذن</small></button>
      </div>
      <div class="field" style="margin-top:24px">
        <label for="sheet-note">ملاحظة (اختياري)</label>
        <input id="sheet-note" maxlength="300">
      </div>
      <div class="row" style="margin-top:24px">
        <button class="btn btn-danger hidden" id="sheet-clear" type="button">إزالة الرصد (حاضر)</button>
        <span class="grow"></span>
        <button class="btn btn-ghost" id="sheet-cancel" type="button">إلغاء</button>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/teacher.js"></script>
</body>
</html>
