<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>كشف حضور الطالب</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: #fff; color: #1a1a1a; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-bottom: 24px; }
    .letter { border: 1px solid #dde5e3; border-radius: 14px; padding: 32px; margin-bottom: 32px; }
    .letter header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid #0f766e; padding-bottom: 16px; margin-bottom: 24px; }
    .letter h1 { font-size: 22px; }
    .letter h2 { font-size: 18px; margin: 24px 0 12px; }
    .info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 24px; }
    .info div span { color: #56625f; font-size: 14px; display: block; }
    .info div b { font-size: 16px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 24px; }
    .kpi { border: 1px solid #dde5e3; border-radius: 10px; padding: 12px 16px; }
    .kpi b { display: block; font-size: 24px; }
    .kpi.absent b { color: #c62828; } .kpi.late b { color: #b45309; } .kpi.escape b { color: #6d28d9; }
    table { font-size: 14px; border: 1px solid #dde5e3; }
    th, td { padding: 6px 12px; color: #1a1a1a; }
    th { background: #eef3f2 !important; color: #333; }
    .badge.absent { background: #fde8e8; color: #c62828; } .badge.late { background: #fdf1dc; color: #b45309; } .badge.escape { background: #efe7fd; color: #6d28d9; }
    .sign { display: flex; justify-content: space-between; margin-top: 48px; color: #56625f; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    @media print {
      .toolbar, .actions { display: none !important; }
      .wrap { padding: 0; max-width: none; }
      .letter { border: none; padding: 0; margin: 0; break-after: page; }
      .letter:last-child { break-after: auto; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @page { size: A4; margin: 16mm; }
    @media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, 1fr); } .letter { padding: 16px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <span class="muted small grow" id="count"></span>
      <button class="btn btn-primary" id="print" type="button">طباعة / حفظ PDF</button>
    </div>
    <div id="letters"></div>
  </div>
  <script src="/common.js"></script>
  <script src="/student-report.js"></script>
</body>
</html>
