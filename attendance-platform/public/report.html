<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>تقرير الحضور</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: #fff; color: #1a1a1a; }
    .report { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
    .report header { border-bottom: 2px solid #0f766e; padding-bottom: 16px; margin-bottom: 24px; }
    .report h1 { font-size: 24px; }
    .report h2 { font-size: 18px; margin: 32px 0 12px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .kpi { border: 1px solid #dde5e3; border-radius: 10px; padding: 12px 16px; }
    .kpi b { display: block; font-size: 24px; }
    table { font-size: 13px; border: 1px solid #dde5e3; }
    th, td { padding: 6px 10px; white-space: normal; color: #1a1a1a; }
    th { background: #eef3f2 !important; color: #333; }
    .toolbar { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 16px; }
    .badge.absent { background: #fde8e8; color: #c62828; }
    .badge.late { background: #fdf1dc; color: #b45309; }
    .badge.escape { background: #efe7fd; color: #6d28d9; }
    @media print {
      .toolbar { display: none; }
      .report { padding: 0; max-width: none; }
      tr { break-inside: avoid; }
      thead { display: table-header-group; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @page { size: A4; margin: 14mm; }
  </style>
</head>
<body>
  <div class="report">
    <div class="toolbar"><button class="btn btn-primary" id="print" type="button">طباعة / حفظ PDF</button></div>
    <header>
      <h1 id="title">تقرير الغياب والتأخير والهروب</h1>
      <p class="muted" id="meta"></p>
    </header>
    <div class="kpis" id="kpis"></div>
    <h2>ملخص الطلاب</h2>
    <table><thead><tr><th>#</th><th>الطالب</th><th>الصف</th><th>الشعبة</th><th>غياب</th><th>تأخير</th><th>هروب</th><th>المجموع</th></tr></thead><tbody id="summary"></tbody></table>
    <h2>السجل التفصيلي</h2>
    <table><thead><tr><th>التاريخ</th><th>الحصة</th><th>الطالب</th><th>الصف</th><th>الشعبة</th><th>الحالة</th><th>المعلم</th></tr></thead><tbody id="records"></tbody></table>
  </div>
  <script src="/common.js"></script>
  <script src="/report.js"></script>
</body>
</html>
