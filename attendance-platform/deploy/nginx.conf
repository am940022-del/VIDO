# ضع هذا الملف في /etc/nginx/sites-available/attendance ثم:
#   ln -s /etc/nginx/sites-available/attendance /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d attendance.example.com      # شهادة HTTPS مجانية
server {
    listen 80;
    server_name attendance.example.com;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
